<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Feddyhub valley</title>
  <desc id="desc">An original pixel-art sunset valley with a coding cabin, rows of crops, a little robot, drifting clouds, and a terminal window.</desc>
  <style>
    .cloud-a{animation:drift 26s ease-in-out infinite alternate}
    .cloud-b{animation:drift 32s ease-in-out infinite alternate-reverse}
    .cursor{animation:blink 1.2s steps(1,end) infinite}
    .window{animation:glow 4s ease-in-out infinite alternate}
    .smoke{animation:rise 5s ease-in-out infinite}
    @keyframes drift{to{transform:translateX(24px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes glow{to{opacity:.68}}
    @keyframes rise{to{transform:translate(9px,-16px);opacity:0}}
    @media (prefers-reduced-motion:reduce){.cloud-a,.cloud-b,.cursor,.window,.smoke{animation:none}}
  </style>
